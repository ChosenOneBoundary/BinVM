name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build (${{ matrix.cc }})
        run: make CC=${{ matrix.cc }}
      - name: Smoke test
        run: make test
      - name: Show binary
        run: file binvm && size binvm
